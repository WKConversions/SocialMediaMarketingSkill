<!doctype html>
<html><head><meta charset="utf-8">
<!-- K.B social explainer (vertical 1080x1920, 30 fps), edited in the style of the Doc2iXBRL reference ad: clean talking
     head, hard cuts to soft gradient backdrops with white UI cards (blur-in + light sweep, a cursor), split layouts where
     a gradient panel slides in next to the speaker, an end card with the mark. Colours and type from the K.B brand kit
     (navy #172b44, light blue #99cdfc, ice #eaf5ff, Manrope). Frame-pure: render(f) is async (it waits for the frame image). -->
<style>
@font-face { font-family: Man; src: url(fonts/Manrope.woff2) format('woff2'); font-weight: 200 800; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #172b44; font-family: Man; color: #172b44; }
.abs { position: absolute; left: 0; top: 0; }
#spk { width: 1080px; height: 1922px; transform-origin: 0 0; }
#ang { width: 1080px; height: 1924px; transform-origin: 0 0; }
.grad { background:
  radial-gradient(70% 46% at var(--gx, 50%) var(--gy, 46%), #dcecfb 0%, rgba(153,205,252,.92) 30%, rgba(111,174,241,.55) 55%, rgba(23,43,68,0) 82%),
  radial-gradient(60% 40% at 92% 4%, #0d1c2d 0%, rgba(13,28,45,0) 72%), radial-gradient(60% 42% at 4% 98%, #0d1c2d 0%, rgba(13,28,45,0) 72%), #2b4a70; }
#full, #endbg { width: 1080px; height: 1920px; }
#panel { width: 1080px; height: 1920px; }
#endbg { background: radial-gradient(80% 40% at 50% 108%, rgba(153,205,252,.55) 0%, rgba(111,174,241,.18) 45%, rgba(23,43,68,0) 75%), #172b44; }
.card { position: absolute; background: #fff; border-radius: 30px; box-shadow: 0 34px 90px rgba(13,28,45,.34), 0 4px 14px rgba(13,28,45,.10); overflow: hidden; }
.sweep { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none;
  background: linear-gradient(105deg, rgba(255,255,255,0) 30%, rgba(234,245,255,.95) 50%, rgba(255,255,255,0) 70%); }
.mut { color: #66768a; } .b { font-weight: 700; } .xb { font-weight: 800; letter-spacing: -0.03em; }
.pill { display: inline-block; padding: 8px 20px; border-radius: 99px; background: #eaf5ff; color: #172b44; font-weight: 700; font-size: 26px; }
.pill.blue { background: #99cdfc; }
.row { display: flex; align-items: center; justify-content: space-between; }
.ic { width: 84px; height: 84px; border-radius: 42px; background: #eaf5ff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 40px; flex: none; }
.field { background: #f5f8fb; border: 2px solid rgba(23,43,68,.10); border-radius: 18px; }
#cursor { width: 44px; height: 44px; }
</style></head>
<body>
<img id="spk" class="abs">
<img id="ang" class="abs">
<div id="full" class="abs grad"></div>
<div id="panel" class="abs grad"></div>
<div id="cards" class="abs" style="width:1080px;height:1920px"></div>
<svg id="cursor" class="abs" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.6L9 19z" fill="#0d1c2d" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
<div id="lt" class="abs" style="left:66px;top:1620px;color:#fff;text-shadow:0 2px 18px rgba(13,28,45,.45);opacity:0"><div style="font-weight:700;font-size:46px;letter-spacing:-0.02em">Karl van Kessel</div><div style="font-weight:400;font-size:32px;margin-top:4px">Consultant Commercial Technology</div></div>
<div id="endbg" class="abs"></div>
<div id="end" class="abs" style="width:1080px;height:1920px"></div>
<script>
const FPS = 30, NV = 586, T = { s2: 4.7333, s3: 7.0667, s4: 11.7, s5: 13.4667, endV: 19.5333, out: 20.3, end: 23.2333, total: 26.0 };   // out: the outro line (88 frames, images 586..673)
const $ = id => document.getElementById(id), clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, u) => a + (b - a) * u, seg = (t, a, b) => clamp((t - a) / (b - a));
function bez(x1, y1, x2, y2) { return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 7; i++) { const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x, d = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t; if (Math.abs(d) < 1e-6) break; t -= cx / d; } return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3; }; }
const OUT = bez(.22, 1, .36, 1), IO = bez(.65, 0, .35, 1);
const C = $('cards'); const CARDS = {};
function card(id, x, y, w, html) { const d = document.createElement('div'); d.className = 'card'; d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.width = w + 'px'; d.innerHTML = html + '<div class="sweep"></div>'; C.appendChild(d); CARDS[id] = d; return d; }
// a card arrives the way the reference's do: out of a blur, rising a little, with a light sweeping across it
function enter(d, t, tin, tout, dy = 0, sc = 1) { const a = OUT(seg(t, tin, tin + 0.55)), o = tout ? IO(seg(t, tout, tout + 0.3)) : 0;
  d.style.opacity = (seg(t, tin, tin + 0.25) * (1 - o)).toFixed(3); d.style.filter = a < 1 ? `blur(${((1 - a) * 14).toFixed(2)}px)` : 'none';
  d.style.transform = `translateY(${((1 - a) * 34 + o * 26 + dy).toFixed(2)}px) scale(${((0.965 + 0.035 * a) * sc).toFixed(4)})`;
  const s = seg(t, tin + 0.1, tin + 0.95); d.querySelector('.sweep').style.transform = `translateX(${(-110 + 220 * s).toFixed(1)}%)`; d.querySelector('.sweep').style.opacity = (s > 0 && s < 1 ? 1 : 0); }
const typed = (txt, u) => txt.slice(0, Math.round(txt.length * clamp(u)));
const mmss = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');

// ---- 0. "Most recruitment agencies have no idea": five agencies, each turning into a question mark
card('ag', 110, 1300, 860, `<div style="padding:34px 40px 38px"><div class="row" style="margin-bottom:22px"><div class="b" style="font-size:34px">Recruitment agencies</div><div class="pill" id="agPill">Admin cost?</div></div>
  <div class="row">${[0, 1, 2, 3, 4].map(i => `<div class="tile" style="position:relative;width:140px;height:112px;border-radius:20px;background:#eaf5ff"><svg class="bld" viewBox="0 0 48 48" style="position:absolute;left:44px;top:30px;width:52px;height:52px"><path d="M8 42V12l16-6v36M24 20l16 4v18M4 42h40M14 18v2M14 26v2M14 34v2M32 30v2M32 36v2" fill="none" stroke="#172b44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="qm xb" style="position:absolute;left:0;top:14px;width:140px;text-align:center;font-size:64px;opacity:0">?</div></div>`).join('')}</div></div>`);
// ---- 1. "what their admin actually costs": the number nobody has
card('cost', 110, 1300, 860, `<div style="padding:38px 42px" class="row"><div class="row" style="gap:28px"><div class="ic">€</div><div><div class="mut" style="font-size:30px">Admin cost per month</div>
  <div class="xb" style="font-size:76px;line-height:1.1">€ <span id="q">—</span></div></div></div><div class="pill" id="costPill">Not tracked</div></div>`);
// ---- 2. "It never shows up on an invoice"
card('inv', 100, 560, 880, `<div style="padding:44px 48px 40px"><div class="row" style="margin-bottom:26px"><div><div class="xb" style="font-size:46px">Invoice</div><div class="mut" style="font-size:26px">No. 2026-014</div></div><div class="pill">Recruitment</div></div>
  ${[['Placement fee', '€ 4,500'], ['Job advertising', '€ 320'], ['Software licences', '€ 180']].map(([a, b], i) => `<div class="row irow" style="padding:22px 0;border-top:2px solid rgba(23,43,68,.08);font-size:33px"><span>${a}</span><span class="b">${b}</span></div>`).join('')}
  <div class="row" id="adminRow" style="margin-top:14px;padding:22px 24px;border-radius:18px;border:3px dashed #99cdfc;font-size:33px"><span class="b">Admin time</span><span class="pill blue" id="adminPill">Not on the invoice</span></div></div>`);
// ---- 3. "the half hour of typing after an intake call" (in the panel under the speaker)
card('notes', 90, 1150, 900, `<div style="padding:38px 42px 40px"><div class="row" style="margin-bottom:24px"><div class="row" style="gap:20px"><div class="ic" style="width:64px;height:64px;font-size:30px">✓</div><div><div class="b" style="font-size:34px">Intake call</div><div class="mut" style="font-size:25px">Ended</div></div></div>
  <div class="pill" id="timer" style="font-size:36px;font-variant-numeric:tabular-nums;padding:10px 26px">00:00</div></div>
  <div class="row" style="margin-bottom:10px"><div class="mut" style="font-size:25px">Candidate notes</div><div class="mut" style="font-size:25px">typing <span class="dt">●</span><span class="dt">●</span><span class="dt">●</span></div></div><div class="field" style="height:260px;padding:22px 26px;font-size:30px;line-height:1.5"><span id="note"></span><span id="caret" style="border-left:3px solid #172b44;margin-left:2px"></span></div></div>`);
// ---- 4. "Time one intake"
card('watch', 190, 1320, 700, `<div style="padding:34px 40px" class="row"><div class="row" style="gap:26px"><div class="ic" id="swBtn" style="background:#172b44;color:#fff;font-size:30px">▶</div><div><div class="mut" style="font-size:28px">Intake admin</div><div class="b" style="font-size:30px">Timer running</div></div></div>
  <div class="xb" id="sw" style="font-size:64px;font-variant-numeric:tabular-nums">00:00</div></div>`);
// ---- 5. "Multiply the admin minutes by your monthly candidates and your hourly costs"
card('calc', 90, 1110, 900, `<div style="padding:40px 44px 42px"><div class="row" style="margin-bottom:22px"><div class="xb" style="font-size:42px">Admin cost</div><div class="pill">Example</div></div>
  ${[['Admin minutes per intake', 'v1'], ['Candidates per month', 'v2'], ['Hourly cost', 'v3']].map(([a, id], i) => `<div class="row crow" style="padding:16px 0;font-size:32px"><span><span class="mut b" style="display:inline-block;width:44px">${i ? '×' : ''}</span>${a}</span><span class="field b" id="${id}" style="min-width:150px;text-align:right;padding:12px 22px;font-size:34px;font-variant-numeric:tabular-nums"></span></div>`).join('')}
  <div class="row" id="res" style="margin-top:20px;padding:24px 28px;border-radius:20px;background:#172b44;color:#fff"><span style="font-size:32px">Admin cost per month</span><span class="xb" id="total" style="font-size:66px;font-variant-numeric:tabular-nums">€ 0</span></div></div>`);
// ---- 6. "Want to read more? Check the link."
card('link', 110, 1300, 860, `<div style="padding:36px 40px" class="row"><div class="row" style="gap:26px"><div class="ic"><svg viewBox="0 0 24 24" style="width:40px;height:40px"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1" fill="none" stroke="#172b44" stroke-width="2.2" stroke-linecap="round"/></svg></div><div><div class="mut" style="font-size:28px">Want to read more?</div><div class="xb" style="font-size:44px">Read the full article</div></div></div>
  <div class="pill blue" id="linkBtn" style="font-size:30px;padding:16px 30px">Link ↗</div></div>`);
// ---- end card
$('end').innerHTML = `<img id="mark" src="img/kb-mark.png" style="position:absolute;left:390px;top:560px;width:300px;height:300px;mix-blend-mode:lighten">
  <div id="tag" style="position:absolute;left:90px;top:900px;width:900px;text-align:center;color:#fff;font-weight:800;font-size:72px;line-height:1.08;letter-spacing:-0.045em;white-space:nowrap"><div id="tg1">We build the systems</div><div id="tg2">your business runs on,</div><div id="tg3">with you</div></div>
  <div id="cta" style="position:absolute;left:0;top:1250px;width:1080px;text-align:center"><span class="pill blue" style="font-size:34px;padding:22px 46px">Book a Free Discovery Call</span></div>`;

const NOTE = 'Spoke with the candidate about the role, salary range and notice period. Available from March, prefers hybrid…';
const imgs = { spk: $('spk'), ang: $('ang') };
async function setImg(el, src) { if (el.dataset.src === src) return; el.dataset.src = src; el.src = src; await el.decode().catch(() => {}); }

async function render(f) {
  const t = f / FPS, fo = Math.round(f) - Math.round(T.out * FPS), vf = String(fo >= 0 ? Math.min(673, 586 + fo) : Math.min(NV - 1, Math.max(0, Math.round(f)))).padStart(4, '0');
  const inC = t >= T.s3 && t < T.s4, inE = t >= T.s5 && t < T.out, split = inC || inE;      // the two split shots use the second angle
  await setImg(imgs.spk, `v/p_${vf}.jpg`); if (split) await setImg(imgs.ang, `v/a_${vf}.jpg`);
  // speaker: a slow push per shot; a slightly tighter frame on "Time one intake" (hides the jump cut)
  // framing: the face in the centre of the area where the speaker shows, as wide as the source allows (never past its edges), no zooms
  { const fit = (el, W0, H0, fx, fy, rw, rh, zoom) => { const ww = zoom ? W0 / zoom : Math.min(2 * Math.min(fx, 1 - fx) * W0, 2 * Math.min(fy, 1 - fy) * H0 * rw / rh), sc = rw / ww; el.style.transform = `translate(${(rw / 2 - fx * W0 * sc).toFixed(2)}px, ${(rh / 2 - fy * H0 * sc).toFixed(2)}px) scale(${sc.toFixed(5)})`; return sc; };
    const out = t >= T.out; fit(imgs.spk, 1080, 1922, out ? 0.545 : 0.57, out ? 0.53 : 0.555, 1080, 1920, 1 / 0.86);      // the same width of view for the main take and the outro
    imgs.spk.style.visibility = (t < T.s2 || (t >= T.s4 && t < T.s5) || t >= T.out) ? 'visible' : 'hidden'; }
  imgs.ang.style.visibility = split ? 'visible' : 'hidden'; { const ww = Math.min(2 * 0.43 * 1080, 2 * 0.38 * 1924 * 1080 / 1050), sc = 1080 / ww; imgs.ang.style.transform = `translate(${(540 - 0.43 * 1080 * sc).toFixed(2)}px, ${(525 - 0.38 * 1924 * sc).toFixed(2)}px) scale(${sc.toFixed(5)})`; }   // centred in the 1080x1050 area above the panel
  // backdrops: the full-screen gradient (hard cut, like the reference) and the panel that slides up under the speaker
  const fullOn = (t >= T.s2 && t < T.s3) ? 1 : 0; const ex = IO(seg(t, 18.65, 19.2));      // the panel grows to the full frame for the result
  $('full').style.opacity = fullOn; $('full').style.setProperty('--gx', (50 + 6 * Math.sin(t * 0.7)).toFixed(2) + '%'); $('full').style.setProperty('--gy', (44 + 4 * Math.cos(t * 0.5)).toFixed(2) + '%');
  let py = 1920; if (inC) py = lerp(1920, 1050, OUT(seg(t, T.s3 + 0.05, T.s3 + 0.6))); else if (inE) py = lerp(lerp(1920, 1050, OUT(seg(t, T.s5 + 0.05, T.s5 + 0.6))), 0, ex);
  $('panel').style.transform = `translateY(${py.toFixed(2)}px)`; $('panel').style.setProperty('--gx', (50 + 5 * Math.sin(t * 0.6)).toFixed(2) + '%'); $('panel').style.setProperty('--gy', (lerp(24, 46, ex) + 2 * Math.cos(t * 0.5)).toFixed(2) + '%');
  { const i = OUT(seg(t, 0.08, 0.7)), o = seg(t, 2.1, 2.45); $('lt').style.opacity = (seg(t, 0.08, 0.4) * (1 - o)).toFixed(3); $('lt').style.transform = `translateY(${((1 - i) * 16).toFixed(2)}px)`; }   // the name, as in the reference
  // 0 agencies: tiles pop in one by one, then flip to question marks on "no idea"
  { const d = CARDS.ag; enter(d, t, 0.5, 2.38); d.querySelectorAll('.tile').forEach((tl, i) => { const a = OUT(seg(t, 0.75 + i * 0.09, 1.2 + i * 0.09)), q = OUT(seg(t, 1.9 + i * 0.07, 2.2 + i * 0.07));
      tl.style.opacity = a; tl.style.transform = `translateY(${((1 - a) * 18).toFixed(2)}px) scale(${(1 + 0.08 * Math.sin(Math.PI * q)).toFixed(3)})`; tl.style.background = q > 0.5 ? '#99cdfc' : '#eaf5ff';
      tl.querySelector('.bld').style.opacity = 1 - q; tl.querySelector('.qm').style.opacity = q; });
    const pa = OUT(seg(t, 1.85, 2.25)); $('agPill').style.opacity = pa; $('agPill').style.transform = `scale(${(0.8 + 0.2 * pa).toFixed(3)})`; }
  // 1 cost card
  enter(CARDS.cost, t, 2.62, 4.45); $('q').textContent = Math.floor(t * 4) % 2 ? '—' : '?';
  // 2 invoice
  { const d = CARDS.inv; enter(d, t, T.s2 + 0.02, 0, 0, 1 + 0.03 * seg(t, T.s2, T.s3)); d.style.opacity = fullOn ? d.style.opacity : 0;
    d.querySelectorAll('.irow').forEach((r, i) => { const a = OUT(seg(t, T.s2 + 0.25 + i * 0.13, T.s2 + 0.7 + i * 0.13)); r.style.opacity = a; r.style.transform = `translateY(${(1 - a) * 14}px)`; const hgl = Math.sin(Math.PI * seg(t, 5.2 + i * 0.22, 5.5 + i * 0.22)); r.style.background = `rgba(234,245,255,${(0.9 * hgl).toFixed(3)})`; r.style.boxShadow = `0 0 0 ${(12 * hgl).toFixed(1)}px rgba(234,245,255,${(0.9 * hgl).toFixed(3)})`; });
    const a = OUT(seg(t, 5.9, 6.4)); $('adminRow').style.opacity = seg(t, 5.55, 5.9); $('adminRow').style.background = `rgba(234,245,255,${a.toFixed(3)})`; $('adminPill').style.opacity = a; $('adminPill').style.transform = `scale(${(0.8 + 0.2 * a).toFixed(3)})`; }
  // 3 notes + timer
  { const d = CARDS.notes; enter(d, t, T.s3 + 0.3, 0); d.style.opacity = inC ? d.style.opacity : 0;
    $('note').textContent = typed(NOTE, seg(t, 7.75, 11.6)); $('caret').style.opacity = Math.floor(t * 2.5) % 2 ? 1 : 0.15; document.querySelectorAll('.dt').forEach((e, i) => { e.style.opacity = (0.25 + 0.75 * Math.max(0, Math.sin(t * 7 - i * 0.9))).toFixed(2); e.style.fontSize = '16px'; e.style.marginLeft = '4px'; });
    const u = IO(seg(t, 8.25, 9.35)); $('timer').textContent = mmss(1800 * u); $('timer').style.background = u >= 1 ? '#99cdfc' : '#eaf5ff'; $('timer').style.transform = `scale(${(1 + 0.12 * Math.sin(Math.PI * seg(t, 9.3, 9.7))).toFixed(3)})`; }
  // 4 stopwatch
  { enter(CARDS.watch, t, 11.85, 13.2); if (t >= T.s5 || t < T.s4) CARDS.watch.style.opacity = 0; const e = Math.max(0, t - 12.05) * 21; $('sw').textContent = mmss(e); $('swBtn').textContent = t >= 12.05 ? '❚❚' : '▶'; $('swBtn').style.transform = `scale(${(1 - 0.14 * Math.sin(Math.PI * seg(t, 11.98, 12.2))).toFixed(3)})`; $('swBtn').style.background = t >= 12.05 ? '#6faef1' : '#172b44'; }
  // 5 calculator: values land on the words; the result counts up as the panel takes the whole frame
  { const d = CARDS.calc; enter(d, t, T.s5 + 0.3, 0, lerp(40, -430, ex), 1 + 0.07 * ex); if (t < T.s5 || t >= T.out) d.style.opacity = 0;
    const val = (id, tf, tin, v, pre = '') => { const a = OUT(seg(t, tin, tin + 0.45)), foc = t >= tf && a < 1; $(id).textContent = t < tin ? (foc && Math.floor(t * 2.5) % 2 ? '|' : '\u00a0') : pre + Math.round(v * a); $(id).style.borderColor = foc ? '#6faef1' : 'rgba(23,43,68,.10)'; $(id).style.background = foc ? '#eaf5ff' : '#f5f8fb'; };
    val('v1', 14.55, 14.98, 30); val('v2', 16.0, 17.04, 40); val('v3', 17.75, 18.4, 45, '€ ');
    d.querySelectorAll('.crow').forEach((r, i) => { const a = OUT(seg(t, 13.95 + i * 0.12, 14.4 + i * 0.12)); r.style.opacity = a; r.style.transform = `translateY(${((1 - a) * 12).toFixed(2)}px)`; });
    const ra = OUT(seg(t, 18.75, 19.2)); $('res').style.opacity = ra; $('res').style.transform = `translateY(${(1 - ra) * 16}px)`; $('total').textContent = '€ ' + Math.round(900 * OUT(seg(t, 18.95, 19.75))); }
  // cursor (dark arrow): visits the invoice's missing line, then the calculator's fields
  { let x = 1200, y = 2000, o = 0;
    if (t >= T.s2 && t < T.s3) { const a = OUT(seg(t, 4.9, 5.25)), b = seg(t, 5.25, 5.75), c = IO(seg(t, 5.78, 6.15)); x = lerp(lerp(960, 800, a), 250, c); y = lerp(lerp(lerp(1500, 775, a), 953, b), 1118, c); o = seg(t, 4.9, 5.1); }
    else if (t >= 11.7 && t < 13.2) { const u = OUT(seg(t, 11.72, 12.0)); x = lerp(760, 262, u); y = lerp(1700, 1392, u); o = seg(t, 11.72, 11.85) * (1 - seg(t, 12.9, 13.15)); }
    else if (t >= 21.6 && t < T.end) { const u = OUT(seg(t, 21.7, 22.4)); x = lerp(700, 868, u); y = lerp(1780, 1392, u); o = seg(t, 21.7, 21.9) * (1 - seg(t, 22.95, 23.15)); }
    else if (t >= 14.2 && t < 18.7) { const a = IO(seg(t, 14.2, 14.55)), b = IO(seg(t, 15.6, 16.0)), c = IO(seg(t, 17.35, 17.75)); x = lerp(1000, 880, a); y = lerp(1850, 1335, a) + 97 * b + 97 * c; o = seg(t, 14.2, 14.4) * (1 - seg(t, 18.55, 18.7)); }
    const cl = Math.max(Math.sin(Math.PI * seg(t, 22.45, 22.7)), Math.sin(Math.PI * seg(t, 6.2, 6.45)), Math.sin(Math.PI * seg(t, 11.98, 12.2)), Math.sin(Math.PI * seg(t, 14.55, 14.75)), Math.sin(Math.PI * seg(t, 16.0, 16.2)), Math.sin(Math.PI * seg(t, 17.75, 17.95)));
    $('cursor').style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${(1 - 0.18 * cl).toFixed(3)})`; $('cursor').style.opacity = o; }
  // 6 the link card: in on "Want to read more?", the cursor clicks the link on "Check the link"
  { enter(CARDS.link, t, T.out + 0.3, T.end - 0.3); if (t < T.out) CARDS.link.style.opacity = 0;
