    h.style.transform = `scale(${(1.045 - 0.045 * SIG(seg(t, 9.8, 12.0))).toFixed(5)})`; }
  $('habDark').style.opacity = (SIG(seg(t, 11.5, 12.05)) * (1 - 0.45 * SIG(seg(t, 12.3, 14.2)))).toFixed(3);   // the stars return faintly behind the logo

  // the shield: drawn by two pens from the top; holds; carried over the base as its dome; fades
  { let d = '';
    if (t >= S.shT0 && t < S.shT1) { const n = S.shieldP.length, k = Math.max(2, Math.round(n / 2 * PEN(seg(t, S.shT0, S.shT1))));
      d = dstr(S.shieldP.slice(0, k + 1)) + dstr([S.shieldP[0]].concat(S.shieldP.slice(n - k).reverse())); }
    else if (t >= S.shT1) { const u = SIG(seg(t, 9.8, 10.6)); d = dstr(S.shieldP.map((p, i) => [lerp(p[0], S.domeP[i][0], u), lerp(p[1], S.domeP[i][1], u)])) + 'Z'; }
    S.shLine.setAttribute('d', d); S.shGlow.setAttribute('d', d);
    const pulse = t >= S.shT1 ? Math.exp(-(t - S.shT1) / 0.35) : 0;
    S.shG.setAttribute('opacity', (t >= S.shT0 ? 1 : 0) * (1 - seg(t, 11.45, 11.9)));
    S.shLine.setAttribute('stroke-width', (3 + 1.4 * pulse).toFixed(2)); S.shGlow.setAttribute('opacity', (0.6 + 0.25 * pulse).toFixed(3)); }

  // radiation streaks and their impacts
  { const g = S.fx; g.clearRect(0, 0, W, H);
    for (const p of S.parts) {
      if (t < p.t0 || t > p.ta + 0.3) continue;
      const L = Math.hypot(p.tx - p.ox, p.ty - p.oy), ux = (p.tx - p.ox) / L, uy = (p.ty - p.oy) / L;
      const dist = Math.min(L, (t - p.t0) * p.v), hx = p.ox + ux * dist, hy = p.oy + uy * dist;
      const tail = Math.max(0, Math.min(p.len, dist) - Math.max(0, (t - p.ta) * p.v));
      if (tail > 1) { const tx = hx - ux * tail, ty = hy - uy * tail, gr = g.createLinearGradient(tx, ty, hx, hy);
        gr.addColorStop(0, 'rgba(255,196,150,0)'); gr.addColorStop(1, 'rgba(255,240,226,0.92)');
        g.lineCap = 'round'; g.globalAlpha = 0.22; g.strokeStyle = gr; g.lineWidth = p.w * 4; g.beginPath(); g.moveTo(tx, ty); g.lineTo(hx, hy); g.stroke();
        g.globalAlpha = 1; g.lineWidth = p.w; g.beginPath(); g.moveTo(tx, ty); g.lineTo(hx, hy); g.stroke(); }
      if (t >= p.ta) { const q = (t - p.ta) / 0.3, r = 3 + 16 * SIG(q), a = (1 - q) ** 1.5;
        const blue = p.kind === 'shield';
        g.strokeStyle = blue ? `rgba(120,165,255,${(0.9 * a).toFixed(3)})` : `rgba(255,226,200,${(0.8 * a).toFixed(3)})`;
        g.lineWidth = 1.6; g.beginPath(); g.arc(p.tx, p.ty, r, 0, 2 * Math.PI); g.stroke();
        g.fillStyle = blue ? `rgba(160,195,255,${(0.9 * a).toFixed(3)})` : `rgba(255,240,226,${(0.9 * a).toFixed(3)})`;
        g.beginPath(); g.arc(p.tx, p.ty, 2.4 * a + 0.5, 0, 2 * Math.PI); g.fill(); }
    } }

  // type: each line rises out of its mask; leaves upward and fades
  for (const L of S.lines) { const a = SIG(seg(t, L.tin, L.tin + 0.7)), o = SIG(seg(t, L.tout + 0.05 * L.k, L.tout + 0.05 * L.k + 0.4));
    L.d.style.transform = `translateY(${((1 - a) * L.h - o * 30).toFixed(2)}px)`; L.d.style.opacity = (1 - o).toFixed(3); }
  { const a = SIG(seg(t, 0.25, 0.85)), o = SIG(seg(t, 2.8, 3.2)); S.eyebrow.style.opacity = (a * (1 - o)).toFixed(3);
    S.eyebrow.style.transform = `translateY(${((1 - a) * 16 - o * 20).toFixed(2)}px)`; }
  for (const B of S.bodies) { const r = SIG(seg(t, B.tin, B.tin + 0.5)), a = SIG(seg(t, B.tin + 0.15, B.tin + 0.75)), o = SIG(seg(t, B.tout + 0.1, B.tout + 0.5));
    B.r.style.transform = `scaleY(${r.toFixed(4)})`; B.r.style.opacity = (1 - o).toFixed(3);
    B.b.style.opacity = (a * (1 - o)).toFixed(3); B.b.style.transform = `translateY(${((1 - a) * 18 - o * 24).toFixed(2)}px)`; }
  for (const D of S.divs) { const a = SIG(seg(t, D.t, D.t + 0.6)), o = seg(t, 11.45, 11.8); D.d.style.transform = `scaleX(${a.toFixed(4)})`; D.d.style.opacity = (1 - o).toFixed(3); }
  for (const D of S.dots) { const a = SIG(seg(t, D.t, D.t + 0.4)), o = seg(t, 11.45, 11.8); D.d.style.opacity = (a * (1 - o)).toFixed(3); D.d.style.transform = `scale(${a.toFixed(3)})`; }
  // the logo: one dissolve on the lift, then it holds and breathes
  { const a = SIG(seg(t, 11.95, 12.75)); S.logo.style.opacity = a.toFixed(3);
    S.logo.style.filter = `blur(${((1 - a) * 14).toFixed(2)}px)`;
    S.logo.style.transform = `scale(${(1.035 - 0.035 * a + 0.015 * seg(t, 12.75, 15)).toFixed(5)})`; }
  $('grainT').setAttribute('seed', String(1 + (Math.floor(f / 1.25) % 40)));
}
window.render = render;
window.__ready = (async () => {
  await document.fonts.load('400 140px Man'); await document.fonts.load('500 32px Man'); await document.fonts.load('800 100px Mont');
  S.sunFrames = await Promise.all(Array.from({ length: META.sun.frames }, (_, i) => { const im = new Image(); im.src = `img/sun/f${String(i + 1).padStart(3, '0')}.jpg`; return im.decode().then(() => im); }));
  await Promise.all([...document.images].map(im => im.decode().catch(() => {})));
  const gltf = await new GLTFLoader().loadAsync('./img/mars.glb');
  build(gltf.scene); render(0);
  window.CUES = { lines: S.lines.map(l => l.tin), parts: S.parts.map(p => ({ t: p.ta, kind: p.kind })), shield: [S.shT0, S.shT1], logo: 11.95 };
})();
</script>
