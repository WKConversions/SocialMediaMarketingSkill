     Mars (the site's model) on ESO's Milky Way; the Sun (NASA SDO 304 A film) and solar wind in 3D; a holographic
     astronaut scanned into view inside a hexagonal shield that the wind breaks on; the astronaut's points re-form as a
     holographic station with 3D-tracked callouts; every point streams into the MARSOPS logo, which settles clean.
     Frame-pure render(f). -->

// ------------------------------------------------------------------ render(f)
function arcPath(cx, cy, r, a0, a1) { const p0 = [cx + r * Math.cos(a0), cy + r * Math.sin(a0)], p1 = [cx + r * Math.cos(a1), cy + r * Math.sin(a1)];

function render(f) {
