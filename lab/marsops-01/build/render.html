<!doctype html>
<html><head><meta charset="utf-8">
<!-- MARSOPS launch teaser (15 s, 1080x1920, 30 fps). One frame-pure render(f): every element's state comes from the
     frame number alone (see ../storyboard/plan.md). Thread object: the circle (compass -> Mars -> Vitruvian circle ->
     habitat dome -> the line under MARSOPS). Neon blue is used only for protection. -->
<style>
@font-face { font-family: Mont; src: url(fonts/Montserrat.ttf); font-weight: 100 900; }
@font-face { font-family: Leo; src: url(fonts/LaBelleAurore.ttf); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #071022; }
#bg { position: absolute; inset: 0;
      background: radial-gradient(120% 80% at 50% 38%, #10264a 0%, #0a1a36 45%, #060f22 100%); }
svg { position: absolute; left: 0; top: 0; }
.tl { position: absolute; left: 96px; font-family: Mont; font-weight: 600; font-size: 78px; line-height: 92px;
      color: #ffffff; letter-spacing: -0.01em; white-space: nowrap; }
.mask { position: absolute; left: 0; overflow: hidden; height: 100px; width: 1080px; }
#logo { position: absolute; left: 0; width: 1080px; text-align: center; font-family: Mont; font-weight: 800;
        color: #ffffff; letter-spacing: 0.1em; text-indent: 0.1em; white-space: nowrap; }
#soon { position: absolute; left: 0; width: 1080px; text-align: center; font-family: Mont; font-weight: 500;
        font-size: 34px; letter-spacing: 0.42em; text-indent: 0.42em; color: #ffffff; white-space: nowrap; }
</style></head>
<body>
<div id="bg"></div>
<svg id="paper" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.88  0 0 0 0 1  0 0 0 0.06 0"/>
    </filter>
    <filter id="fibres" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.03" numOctaves="3" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.7  0 0 0 0 0.95  0 0 0 0.05 0"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="42%" r="75%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" filter="url(#fibres)"/>
  <rect width="1080" height="1920" filter="url(#grain)"/>
  <rect width="1080" height="1920" fill="url(#vig)"/>
</svg>
<svg id="art" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1680" height="2520">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ink" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.2"/>
    </filter>
  </defs>
  <g id="cam"></g>
</svg>
<div id="text"></div>
<script>
const FPS = 30, W = 1080, H = 1920, N = 450;
const NS = 'http://www.w3.org/2000/svg';
const INK = '#efe6d2', NEON = '#45bdff';
const CX = 540, CY = 800;                       // the circle's centre for the whole film
const K = 1.18;                                  // the drawing's scale on the page: few, big things
// ------------------------------------------------------------------ helpers
let seed = 20261119;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function bez(x1, y1, x2, y2) {                  // cubic-bezier easing, solved by Newton
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x;
    for (let i = 0; i < 6; i++) { const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x;
      const d = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t; if (Math.abs(d) < 1e-6) break; t -= cx / d; }
    return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3; };
}
const SIG = bez(.22, 1, .36, 1);                 // the film's signature curve (arrive)
const PEN = bez(.45, .05, .35, 1);               // a hand: accelerates, then slows into the end of the line
const FLAT = bez(.6, 0, .25, 1);                 // the dome's shield flattening into the line: accelerates into the 12.0 s hit
const lerp = (a, b, u) => a + (b - a) * u;
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || CAM).appendChild(e); return e; }
const CAM = document.getElementById('cam');
function grp(parent, attrs = {}) { return el('g', attrs, parent); }

function resample(pts, step = 5) {               // even spacing along the polyline
  const out = [pts[0]]; let carry = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; const L = Math.hypot(x1 - x0, y1 - y0); let d = step - carry;
    while (d <= L) { const u = d / L; out.push([x0 + (x1 - x0) * u, y0 + (y1 - y0) * u]); d += step; }
    carry = L - (d - step);
  }
  out.push(pts[pts.length - 1]); return out;
}
function wobble(pts, amp = 1.1) {                // a hand's low-frequency wobble along the line
  const p = resample(pts, 5), ph = [rnd() * 6.3, rnd() * 6.3], fr = [0.011 + rnd() * 0.01, 0.03 + rnd() * 0.02];
  let s = 0;
  return p.map((q, i) => { if (i) s += Math.hypot(q[0] - p[i - 1][0], q[1] - p[i - 1][1]);
    const a = i ? Math.atan2(q[1] - p[i - 1][1], q[0] - p[i - 1][0]) : 0;
    const off = amp * (Math.sin(s * fr[0] + ph[0]) + 0.5 * Math.sin(s * fr[1] + ph[1]));
    return [q[0] - Math.sin(a) * off, q[1] + Math.cos(a) * off]; });
}
function overshoot(pts, e0 = 6, e1 = 9) {        // sketch lines run a little past their ends
  if (pts.length < 2) return pts; const [a, b] = [pts[0], pts[1]], [c, d] = [pts[pts.length - 2], pts[pts.length - 1]];
  const la = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, lc = Math.hypot(d[0] - c[0], d[1] - c[1]) || 1;
  return [[a[0] - (b[0] - a[0]) / la * e0, a[1] - (b[1] - a[1]) / la * e0], ...pts, [d[0] + (d[0] - c[0]) / lc * e1, d[1] + (d[1] - c[1]) / lc * e1]];
}
const dstr = pts => 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
function arc(cx, cy, rx, ry, a0, a1, n = 90, rot = 0) {
  const out = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n;
    const x = rx * Math.cos(a), y = ry * Math.sin(a);
    out.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); } return out;
}
const line = (x0, y0, x1, y1) => [[x0, y0], [x1, y1]];
function catmull(P, closed = true, n = 10) {
  const out = [], L = P.length, g = i => P[closed ? (i + L) % L : Math.max(0, Math.min(L - 1, i))];
  for (let i = 0; i < (closed ? L : L - 1); i++) { const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    for (let k = 0; k < n; k++) { const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(j => 0.5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3))); } }
  if (closed) out.push(out[0]); else out.push(P[L - 1]); return out;
}

// ------------------------------------------------------------------ strokes (drawn by dash offset)
const STROKES = [];
function stroke(parent, pts, t0, dur, o = {}) {
  const w = (o.w ?? 2.2) * 1.42 / K, op = o.op ?? 0.9, col = o.col ?? INK;   // page widths (the camera scales by ~K)
  const base = o.raw ? pts : wobble(o.noOver ? pts : overshoot(pts, o.e0 ?? 5, o.e1 ?? 8), o.amp ?? 1.1);
  const p = el('path', { d: dstr(base), fill: 'none', stroke: col, 'stroke-width': w, 'stroke-linecap': 'round',
    'stroke-linejoin': 'round', opacity: op }, parent);
  STROKES.push({ p, t0, dur, ease: o.ease || PEN });
  if (o.pass !== false && !o.raw) {               // the second, lighter pass a draughtsman makes
    const q = el('path', { d: dstr(wobble(overshoot(pts, o.e1 ?? 8, o.e0 ?? 5), (o.amp ?? 1.1) * 1.4)), fill: 'none', stroke: col,
      'stroke-width': w * 0.6, 'stroke-linecap': 'round', opacity: op * 0.45 }, parent);
    STROKES.push({ p: q, t0: t0 + dur * 0.35, dur: dur * 0.9, ease: PEN });
  }
  return p;
}
function hatch(parent, inside, ang, gap, box, t0, dur, o = {}) {   // hatching revealed by a hand's sweep (a mask)
  const d = [], ca = Math.cos(ang), sa = Math.sin(ang), [x0, y0, x1, y1] = box, R = Math.hypot(x1 - x0, y1 - y0);
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
  for (let k = -R; k <= R; k += gap) {
    let run = null;
    for (let s = -R; s <= R; s += 3) {
      const x = mx + ca * s - sa * k + (rnd() - 0.5) * 0.6, y = my + sa * s + ca * k;
      const ok = x > x0 && x < x1 && y > y0 && y < y1 && inside(x, y);
      if (ok && !run) run = [[x, y]]; else if (ok) run[1] = [x, y];
      else if (run) { if (run[1] && Math.hypot(run[1][0] - run[0][0], run[1][1] - run[0][1]) > 4) d.push(run); run = null; }
    }
    if (run && run[1]) d.push(run);
  }
  // cut each run into short strokes with small gaps (a hand hatching in bundles)
  const cut = [];
  for (const [a, b] of d) { const L = Math.hypot(b[0] - a[0], b[1] - a[1]); let u = 0;
    while (u < L) { const len = 24 + rnd() * 46, gap = 3 + rnd() * 9, u1 = Math.min(L, u + len);
      const j = (rnd() - 0.5) * 1.6;
      cut.push([[a[0] + (b[0] - a[0]) * u / L + j, a[1] + (b[1] - a[1]) * u / L], [a[0] + (b[0] - a[0]) * u1 / L - j, a[1] + (b[1] - a[1]) * u1 / L]]);
      u = u1 + gap; } }
  d.length = 0; d.push(...cut);
  const id = 'hm' + STROKES.length + '_' + Math.floor(rnd() * 1e6);
  const m = el('mask', { id, maskUnits: 'userSpaceOnUse', x: -200, y: -200, width: W + 400, height: H + 400 }, parent);
  const r = el('rect', { x: x1, y: -200, width: 0, height: H + 400, fill: '#fff' }, m);
  const g = grp(parent, { mask: `url(#${id})` });
  el('path', { d: d.map(s => 'M' + s[0][0].toFixed(1) + ' ' + s[0][1].toFixed(1) + 'L' + s[1][0].toFixed(1) + ' ' + s[1][1].toFixed(1)).join(''),
    stroke: o.col ?? INK, 'stroke-width': (o.w ?? 1.2) / K, opacity: o.op ?? 0.5, 'stroke-linecap': 'round', fill: 'none' }, g);
  STROKES.push({ sweep: r, x0, x1, t0, dur, dir: o.dir ?? -1 });
}
const NOTES = [];
function note(parent, txt, x, y, t0, dur, size = 34, rot = 0, op = 0.6) {   // mirror script, written right to left
  const id = 'nm' + NOTES.length;
  const m = el('mask', { id, maskUnits: 'userSpaceOnUse', x: -200, y: -200, width: W + 400, height: H + 400 }, parent);
  const r = el('rect', { x: x, y: y - size * 1.4, width: 0, height: size * 2.2, fill: '#fff' }, m);
  const g = grp(parent, { mask: `url(#${id})` });
  const t = el('text', { x: 0, y: 0, 'font-family': 'Leo', 'font-size': size, fill: INK, opacity: op,
    transform: `translate(${x},${y}) rotate(${rot}) scale(-1,1)` }, g);
  t.textContent = txt;
  NOTES.push({ r, t, x, t0, dur, w: 0 });
}
const pre = (px, py) => [CX + (px - CX) / K, CY + (py - CY) / K];   // page position -> drawing coordinates
function noteP(parent, txt, px, py, t0, dur, size, rot, op) { const [x, y] = pre(px, py); note(parent, txt, x, y, t0, dur, size / K, rot, op); }
const ENV = [];                                    // group opacity envelopes: [g, in0, in1, out0, out1]
function env(g, a, b, c = 99, d = 100) { ENV.push([g, a, b, c, d]); return g; }

// ------------------------------------------------------------------ the film
const S = {};
function build() {
  // ===== thread: the circle (drawn once at r = 330; it scales to 400 and changes role)
  S.circleG = grp(CAM); S.circleTop = grp(S.circleG); S.circleBot = grp(S.circleG);
  stroke(S.circleTop, arc(CX, CY, 330, 330, Math.PI, 2 * Math.PI, 120), 0.10, 0.62, { w: 2.6, op: 0.95, ease: x => x, e0: 0, e1: 10 });
  stroke(S.circleBot, arc(CX, CY, 330, 330, 0, Math.PI, 120), 0.10 + 0.62, 0.62, { w: 2.6, op: 0.95, ease: x => x, e0: 0, e1: 14 });
  // compass: needle at the centre, pencil on the arc (drawn every frame)
  S.compass = grp(CAM, { opacity: 0 });
  S.cLegA = el('path', { fill: 'none', stroke: INK, 'stroke-width': 3, opacity: 0.8, 'stroke-linecap': 'round' }, S.compass);
  S.cLegB = el('path', { fill: 'none', stroke: INK, 'stroke-width': 3, opacity: 0.8, 'stroke-linecap': 'round' }, S.compass);
  S.cHinge = el('circle', { r: 7, fill: 'none', stroke: INK, 'stroke-width': 2.5, opacity: 0.85 }, S.compass);

  // ===== beat 1: Mars
  const m1 = env(grp(CAM), 0, 0.01, 3.55, 3.95);
  stroke(m1, line(CX - 420, CY, CX + 420, CY), -0.25, 0.6, { w: 1, op: 0.35, pass: false });
  stroke(m1, line(CX, CY - 420, CX, CY + 420), -0.12, 0.6, { w: 1, op: 0.35, pass: false });
  stroke(m1, arc(CX, CY, 352, 352, Math.PI * 0.95, Math.PI * 1.9, 80), 1.0, 0.6, { w: 1.2, op: 0.4, pass: false });   // thin air
  const inMars = (x, y) => Math.hypot(x - CX, y - CY) < 324;
  const shade = (x, y) => (x - CX) * 0.62 + (y - CY) * 0.78;          // the sun is upper left: shadow lower right
  hatch(m1, (x, y) => inMars(x, y) && shade(x, y) > -40, 0.8, 8, [CX - 330, CY - 330, CX + 330, CY + 330], 1.2, 1.1, { op: 0.45 });
  hatch(m1, (x, y) => inMars(x, y) && shade(x, y) > 120, 1.12, 8.5, [CX - 330, CY - 330, CX + 330, CY + 330], 1.85, 0.9, { op: 0.4 });
  hatch(m1, (x, y) => Math.hypot(x - CX, y - CY) > 322 && Math.hypot(x - CX, y - CY) < 346 && shade(x, y) > 60, 0.8, 6, [CX - 350, CY - 350, CX + 350, CY + 350], 2.1, 0.6, { op: 0.3 });
  [[-120, -90, 46, 30, 0.2], [70, -170, 26, 17, -0.3], [150, 60, 38, 24, 0.5], [-60, 140, 30, 20, 0.1], [-210, 40, 20, 13, 0],
   [20, 30, 54, 34, -0.2], [210, -60, 18, 12, 0.4]].forEach(([dx, dy, rx, ry, r], k) =>
    stroke(m1, arc(CX + dx, CY + dy, rx, ry, 0, 6.2, 40, r), 1.25 + k * 0.12, 0.32, { w: 1.6, op: 0.75, e0: 0, e1: 6 }));
  noteP(m1, 'Marte', 990, 1262, 1.6, 0.55, 66, -4, 0.7);
  noteP(m1, 'i raggi del sole', 640, 262, 1.85, 0.8, 50, 6, 0.62);
  noteP(m1, 'aria sottile', 330, 470, 2.3, 0.6, 40, -8, 0.5);

  // ===== beat 2: the Vitruvian astronaut (inside the grown circle, r = 400)
  const v = env(grp(CAM), 0, 0.01, 7.55, 7.95);
  const R2 = 400, sq = 660, sqTop = CY + R2 - sq, sqL = CX - sq / 2;   // square: feet on the circle, Leonardo's proportion
  stroke(v, line(sqL, sqTop, sqL + sq, sqTop), 4.05, 0.34, { w: 2.2 });
  stroke(v, line(sqL + sq, sqTop, sqL + sq, sqTop + sq), 4.30, 0.34, { w: 2.2 });
  stroke(v, line(sqL + sq, sqTop + sq, sqL, sqTop + sq), 4.55, 0.34, { w: 2.2 });
  stroke(v, line(sqL, sqTop + sq, sqL, sqTop), 4.80, 0.34, { w: 2.2 });
  for (let k = 1; k < 8; k++) { const y = sqTop + sq * k / 8;               // eight heads: proportion ticks
    stroke(v, line(sqL - 14, y, sqL + 10, y), 4.6 + k * 0.03, 0.12, { w: 1.2, op: 0.6, pass: false });
    stroke(v, line(sqL + sq - 10, y, sqL + sq + 14, y), 4.62 + k * 0.03, 0.12, { w: 1.2, op: 0.6, pass: false }); }
  const fig = grp(v), ghost = grp(v, { opacity: 0.45 });
  const hy = sqTop + 62;                                                  // helmet centre
  stroke(fig, arc(CX, hy, 54, 56, -Math.PI / 2, Math.PI * 1.5, 60), 4.6, 0.38, { w: 2.6, e0: 0, e1: 8 });
  stroke(fig, arc(CX, hy + 8, 38, 26, 0, 6.28, 50), 4.9, 0.28, { w: 2.2, e0: 0, e1: 5 });            // visor
  stroke(fig, arc(CX, hy + 64, 48, 11, 0, 6.28, 50), 5.02, 0.18, { w: 2 });                           // neck ring
  const sh = hy + 80, wa = sqTop + 330;
  stroke(fig, [[CX - 84, sh], [CX - 90, sh + 60], [CX - 70, wa - 40], [CX - 62, wa]], 5.05, 0.34, { w: 2.6 });
  stroke(fig, [[CX + 84, sh], [CX + 90, sh + 60], [CX + 70, wa - 40], [CX + 62, wa]], 5.10, 0.34, { w: 2.6 });
  stroke(fig, [[CX - 84, sh], [CX - 40, sh - 12], [CX + 40, sh - 12], [CX + 84, sh]], 5.0, 0.22, { w: 2.2 });
  stroke(fig, [[CX - 44, sh + 30], [CX + 44, sh + 30], [CX + 44, sh + 92], [CX - 44, sh + 92], [CX - 44, sh + 30]], 5.36, 0.3, { w: 1.8, op: 0.8 });   // chest unit
  [[-22, 61], [0, 61], [22, 61]].forEach(([dx, dy], k) => stroke(fig, arc(CX + dx, sh + dy, 7, 7, 0, 6.28, 20), 5.55 + k * 0.05, 0.12, { w: 1.4, pass: false, e0: 0, e1: 2 }));
  stroke(fig, [[CX - 100, sh + 4], [CX - 104, wa - 30]], 5.2, 0.25, { w: 1.4, op: 0.55, pass: false });      // backpack edges
  stroke(fig, [[CX + 100, sh + 4], [CX + 104, wa - 30]], 5.2, 0.25, { w: 1.4, op: 0.55, pass: false });
  stroke(fig, arc(CX, wa, 64, 12, 0, 6.28, 50), 5.5, 0.18, { w: 2 });                                  // waist ring
  // arms, horizontal: shoulder to glove, upper arm and forearm with a bulge, elbow and wrist rings
  const ay = sh + 18;
  for (const s of [-1, 1]) {
    const x0 = CX + s * 86, x1 = CX + s * (sq / 2 - 34), X = u => lerp(x0, x1, u);
    stroke(fig, catmull([[x0, ay - 26], [X(0.22), ay - 31], [X(0.42), ay - 25], [X(0.62), ay - 28], [X(0.86), ay - 21], [x1, ay - 20]], false, 6), 5.25, 0.42, { w: 2.4 });
    stroke(fig, catmull([[x0, ay + 32], [X(0.22), ay + 34], [X(0.42), ay + 27], [X(0.62), ay + 29], [X(0.86), ay + 22], [x1, ay + 22]], false, 6), 5.30, 0.42, { w: 2.4 });
    [0.42, 0.86].forEach((u, k) => { const x = X(u);
      stroke(fig, arc(x, ay + 2, 8, 27 - u * 5, 0, 6.28, 30), 5.6 + k * 0.06, 0.14, { w: 1.6, pass: false, e0: 0, e1: 3 }); });
    stroke(fig, catmull([[x1, ay - 20], [x1 + s * 30, ay - 22], [x1 + s * 44, ay + 2], [x1 + s * 30, ay + 26], [x1, ay + 22]], false, 6), 5.72, 0.22, { w: 2.2 });   // glove
    stroke(fig, [[x1 + s * 30, ay - 22], [x1 + s * 40, ay - 34]], 5.86, 0.08, { w: 1.6, pass: false });                                                   // thumb
  }
  // legs, standing: hip to boot, thigh and calf with a bulge, knee rings
  for (const s of [-1, 1]) {
    const fy = sqTop + sq - 46, Y = u => lerp(wa + 14, fy, u);
    stroke(fig, catmull([[CX + s * 62, wa + 10], [CX + s * 70, Y(0.25)], [CX + s * 64, Y(0.5)], [CX + s * 68, Y(0.72)], [CX + s * 64, fy]], false, 6), 5.55, 0.45, { w: 2.4 });
    stroke(fig, catmull([[CX + s * 6, wa + 22], [CX + s * 10, Y(0.25)], [CX + s * 20, Y(0.5)], [CX + s * 16, Y(0.72)], [CX + s * 22, fy]], false, 6), 5.60, 0.45, { w: 2.4 });
    stroke(fig, arc(CX + s * 42, Y(0.5), 25, 7, 0, 6.28, 30), 5.95, 0.14, { w: 1.6, pass: false, e0: 0, e1: 3 });
    stroke(fig, catmull([[CX + s * 18, fy], [CX + s * 16, fy + 30], [CX + s * 30, fy + 44], [CX + s * 80, fy + 44], [CX + s * 74, fy]], false, 6), 6.0, 0.26, { w: 2.4 });   // boot

    const x1 = x0 + s * Math.cos(a) * len, y1 = ay + Math.sin(a) * len;

    [sqL + sq + 22, ay + 58], [CX + 250, ay + 64], [CX + 116, sh + 120], [CX + 104, wa + 60], [CX + 98, sqTop + sq - 90], [CX + 104, sqTop + sq + 18],

  S.shield = el('path', { fill: 'none', stroke: NEON, 'stroke-width': 3.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, S.shieldG);
  S.shieldT0 = 6.25; S.shieldT1 = 7.2;
  noteP(v, "lo scudo dell'uomo", 560, 222, 6.75, 0.8, 52, -3, 0.68);
  stroke(v, [pre(250, 250), pre(150, 600)], 6.55, 0.3, { w: 1.2, op: 0.6, pass: false });
  noteP(v, 'proporzioni', 1010, 1300, 4.75, 0.6, 40, 3, 0.5);

  // ===== beat 3: the habitat (the circle's top half is the dome's outer shell)
  const hb = env(grp(CAM), 0, 0.01, 11.45, 11.85);
  const gy = CY;                                                          // ground line through the circle's centre
  const terrain = []; for (let x = 40; x <= 1040; x += 10) terrain.push([x, gy + (Math.abs(x - CX) < 410 ? 0 : 6 * Math.sin(x * 0.03) + 3 * Math.sin(x * 0.11))]);
  stroke(hb, terrain, 8.0, 0.45, { w: 2.4, amp: 0.8 });
  hatch(hb, (x, y) => y > gy + 8 && y < gy + 70 + 14 * Math.sin(x * 0.05), 0.7, 8, [40, gy, 1040, gy + 100], 8.2, 0.6, { op: 0.34 });
  hatch(hb, (x, y) => y > gy + 60 && y < gy + 190 + 40 * Math.sin(x * 0.021) + 20 * Math.sin(x * 0.07), 0.7, 15, [40, gy + 50, 1040, gy + 260], 8.35, 0.6, { op: 0.2 });
  stroke(hb, arc(CX, gy, 330, 330, Math.PI, 2 * Math.PI, 110), 8.15, 0.6, { w: 2.4, e0: 0, e1: 0 });              // inner wall
  // regolith between the shield (365) and the outer shell (400): stipple
  { const g = grp(hb); const pts = []; for (let i = 0; i < 520; i++) { const a = Math.PI + rnd() * Math.PI, r = 372 + rnd() * 24; pts.push([CX + r * Math.cos(a), gy + r * Math.sin(a)]); }

    stroke(hb, [[px + 16 * s, py - 48 * s], [px + 30 * s, py - 30 * s]], t0 + 0.18, 0.14, { w: 1.6, pass: false });
  }
  person(CX - 120, gy, 1.25, 9.1); person(CX - 20, gy, 1.15, 9.25); person(CX - 60, deck, 1.0, 9.4);
  stroke(hb, [[CX + 330, gy - 70], [CX + 470, gy - 70], [CX + 470, gy], [CX + 330, gy]], 9.0, 0.35, { w: 2.2 });  // airlock
  stroke(hb, arc(CX + 420, gy - 36, 18, 24, 0, 6.28, 30), 9.3, 0.15, { w: 1.6, pass: false, e0: 0, e1: 3 });
  noteP(hb, 'la casa su Marte', 990, 236, 9.55, 0.8, 54, -4, 0.68);
  noteP(hb, 'terra sopra il tetto', 470, 300, 9.9, 0.8, 44, 3, 0.58);
  stroke(hb, [pre(300, 325), pre(250, 470)], 9.8, 0.25, { w: 1.1, op: 0.5, pass: false });

  S.shieldSuitR = resample(S.shieldSuit, 4);
  const n = Math.max(S.shieldDome.length, S.shieldSuitR.length);

  S.rays = []; const dir = [0.8, 0.6];
  [1.25, 1.5, 1.75, 2.25, 2.5, 2.75, 3.0, 3.25, 3.5, 3.75].forEach((ti, k) => {                       // beat 1: onto Mars
    const a = Math.PI * (1.0 + 0.55 * rnd()) + 0.1; S.rays.push({ ti, x: CX + 328 * Math.cos(a), y: CY + 328 * Math.sin(a), kind: 'ink' }); });
  const suitTargets = [[CX - 250, ay - 50], [CX - 120, sh - 8], [CX - 70, hy - 30], [sqL + 10, ay - 30], [CX - 104, wa], [CX - 180, ay - 40], [CX - 100, sqTop + sq - 100], [CX - 30, hy - 56]];
  [4.5, 4.75, 5.25, 5.5, 5.75, 6.25, 6.5, 6.75].forEach((ti, k) => { const [x, y] = suitTargets[k]; S.rays.push({ ti, x, y, kind: 'ink' }); });
  const shieldTargets = [[CX - 250, ay - 58], [CX - 76, hy - 30], [sqL - 30, ay - 40], [CX - 110, wa + 30]];

  [8.5, 9.0, 9.25, 9.5, 10.0, 10.25, 10.5, 10.75, 11.0, 11.25].forEach((ti, k) => {                   // beat 3: onto the dome

  tl('Protecting', 1360, 4.9, 7.72); tl('every astronaut,', 1452, 5.05, 7.72);
  tl('from suit', 1360, 8.9, 11.5); tl('to habitat.', 1452, 9.05, 11.5);

  S.logo.style.fontSize = fs.toFixed(1) + 'px'; S.logo.style.lineHeight = (fs * 1.0).toFixed(1) + 'px'; S.logo.style.width = '1080px';

function measure(txt, wght, px, track) {

// ------------------------------------------------------------------ render(f)
function render(f) {

  for (const st of STROKES) {

  }

    const p = clamp((t - nt.t0) / nt.dur); const w = nt.w * PEN(p);

  }
  for (const [g, a, b, c, d] of ENV) g.setAttribute('opacity', (clamp((t - a) / (b - a)) * (1 - clamp((t - c) / (d - c)))).toFixed(3));
  // compass, while the first circle is drawn
  { const p = clamp((t - 0.1) / 1.24), a = Math.PI + 2 * Math.PI * p, px = CX + 330 * Math.cos(a), py = CY + 330 * Math.sin(a);
    const hx = (CX + px) / 2 + Math.sin(a) * 40, hy = (CY + py) / 2 - 300;
    S.cLegA.setAttribute('d', `M${CX} ${CY}L${hx} ${hy}`); S.cLegB.setAttribute('d', `M${px} ${py}L${hx} ${hy}`);
    S.cHinge.setAttribute('cx', hx); S.cHinge.setAttribute('cy', hy);
    S.compass.setAttribute('opacity', (clamp(t / 0.15) * (1 - clamp((t - 1.34) / 0.3))).toFixed(3)); }
  // the circle: grows to the Vitruvian circle; its lower half sinks into the ground for the habitat; it goes with the dome
  { const g1 = SIG(clamp((t - 3.8) / 0.6)); const r = lerp(1, 400 / 330, g1);
    S.circleG.setAttribute('transform', `translate(${CX} ${CY}) scale(${r.toFixed(5)}) translate(${-CX} ${-CY})`);
    S.circleBot.setAttribute('opacity', (1 - clamp((t - 7.9) / 0.4)).toFixed(3));
    S.circleTop.setAttribute('opacity', (1 - clamp((t - 11.45) / 0.4)).toFixed(3)); }
  // the shield: drawn around the suit, carried into the dome, flattened into the line under the name
  { let P, show = 1;
    if (t < S.shieldT1) {                                                 // two pens from the top of the helmet, closing at the feet

    else { const u = FLAT(clamp((t - 11.4) / 0.6)); P = S.B.map((b, i) => [lerp(b[0], S.C[i][0], u), lerp(b[1], S.C[i][1], u)]); }

    L.d.style.transform = `translateY(${((1 - a) * 100 - o * 24).toFixed(2)}px)`; L.d.style.opacity = (1 - o).toFixed(3); }
  { const T = document.getElementById('text'); T.style.transformOrigin = '540px 968px';      // the lockup breathes with the camera
    T.style.transform = t > 12 ? `scale(${(1 + 0.022 * SIG(clamp((t - 12.4) / 2.6))).toFixed(5)})` : ''; }
  { const a = SIG(clamp((t - 12.0) / (16 / FPS))); S.logo.style.transform = `translateY(${((1 - a) * (S.logoH + 30)).toFixed(2)}px)`;
    const b = SIG(clamp((t - 12.45) / (14 / FPS))); S.soon.style.opacity = b.toFixed(3); S.soon.style.transform = `translateY(${((1 - b) * 18).toFixed(2)}px)`; }
}
window.render = render;

</script>
